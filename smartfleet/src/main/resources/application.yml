spring:
  application:
    name: smartfleet

  datasource:
    url: jdbc:h2:mem:smartfleet
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  security:
    filter:
      order: 5

  jackson:
    serialization:
      indent-output: true

logging:
  level:
    root: INFO
    com.smartfleet: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

server:
  port: 8080
  servlet:
    context-path: /

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
