spring:
  application:
    name: smartfleet

  datasource:
    # Base fichier : les donnees survivent au redemarrage (create-drop les effacait).
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smartfleet;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  jackson:
    serialization:
      indent-output: true

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisConnectionFactoryAutoConfiguration
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration

# /actuator/health doit repondre 200 : c'est le healthcheck du docker-compose.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    # Pas de serveur SMTP ni de Redis dans ce deploiement : ces indicateurs
    # faisaient repondre /actuator/health en DOWN et cassaient le healthcheck Docker.
    mail:
      enabled: false
    redis:
      enabled: false
    ping:
      enabled: true

logging:
  level:
    root: INFO
    com.smartfleet: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

server:
  # PORT est impose par l'hebergeur et n'est pas negociable : un service qui
  # ecoute ailleurs est declare en echec au deploiement. SERVER_PORT reste le
  # reglage local, 9090 le defaut de developpement.
  port: ${PORT:${SERVER_PORT:9090}}
  address: 0.0.0.0
  servlet:
    context-path: /

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173,http://localhost:3000}
