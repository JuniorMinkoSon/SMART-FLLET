<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 64 64">
  <defs>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="32" cy="32" r="32" fill="url(#grad1)" opacity="0.1"/>

  <!-- Main Volt symbol - dynamic zigzag -->
  <!-- Top left diagonal -->
  <path d="M 20 16 L 32 28 L 20 40" stroke="url(#grad1)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top right diagonal with cyan accent -->
  <path d="M 32 28 L 44 16 L 48 24" stroke="url(#grad2)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur1)"/>

  <!-- Bottom section - lightning bolt effect -->
  <path d="M 32 28 L 44 40 L 36 44 L 44 56 L 24 48 L 32 40" fill="url(#grad1)" opacity="0.9"/>

  <!-- Accent glow elements -->
  <circle cx="20" cy="16" r="2" fill="url(#grad2)" opacity="0.7"/>
  <circle cx="44" cy="56" r="2" fill="url(#grad2)" opacity="0.7"/>

  <!-- Subtle background elements -->
  <ellipse cx="32" cy="32" rx="26" ry="20" fill="none" stroke="url(#grad2)" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="32" cy="32" rx="22" ry="18" fill="none" stroke="url(#grad1)" stroke-width="0.5" opacity="0.3"/>
</svg>
