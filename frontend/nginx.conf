server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les assets fingerprintes par Vite sont immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /engins/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # L'API est relayee vers le backend : une seule origine cote navigateur,
    # donc aucun CORS a gerer.
    location /api/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA : toute route inconnue renvoie index.html (react-router gere ensuite).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
