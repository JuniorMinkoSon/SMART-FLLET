services:
  # ---------------------------------------------------------------------------
  # Backend Spring Boot. Ecoute sur 9090 (voir smartfleet/application.yml) :
  # l'ancien compose mappait 8080 et sondait 8080/actuator/health, donc le
  # service etait injoignable et le healthcheck toujours KO.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./smartfleet
      dockerfile: Dockerfile
    container_name: smartfleet-backend
    environment:
      SERVER_PORT: 9090
      # Base fichier persistee dans un volume : les donnees survivent au
      # redemarrage du conteneur.
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/smartfleet;MODE=MySQL;AUTO_SERVER=TRUE
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      JPA_DDL_AUTO: update
      # Origine du navigateur autorisee a appeler l'API.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-9090}:9090"
    volumes:
      - smartfleet-data:/data
    networks:
      - smartfleet-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Frontend : build Vite servi par nginx, qui relaie /api vers le backend.
  # Le navigateur ne parle donc qu'a une seule origine (pas de CORS).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL relative : nginx proxifie /api vers le service backend.
        VITE_API_URL: ""
    container_name: smartfleet-frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartfleet-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  smartfleet-net:
    driver: bridge

volumes:
  smartfleet-data:
